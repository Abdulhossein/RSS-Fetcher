name: Update RSS feeds

on:
  schedule:
    # Daily at 05:00 UTC (GitHub cron is always UTC)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  fetch:
    # Pinned to avoid the ubuntu-latest -> Ubuntu 26 migration notice
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync with latest branch tip
        run: |
          # This run may have been queued behind a previous one that already
          # pushed; start from the latest tip so the final push never conflicts.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Fetch feeds
        run: python rss_fetcher.py

      - name: Update feed URLs in README (owner/repo/branch)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          python - "$OWNER" "$REPO" "$BRANCH" <<'PY'
          import re, sys
          owner, repo, branch = sys.argv[1:4]
          path = "README.md"
          text = open(path, encoding="utf-8").read()
          pattern = re.compile(
              r"(https://raw\.githubusercontent\.com/)[^/]+/[^/]+/(?:refs/heads/)?[^/\s]+/"
          )
          new_text, n = pattern.subn(rf"\g<1>{owner}/{repo}/refs/heads/{branch}/", text)
          open(path, "w", encoding="utf-8", newline="\n").write(new_text)
          print(f"Rewrote {n} feed URL(s) -> {owner}/{repo}@{branch}")
          PY

      - name: Commit and push feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # feeds/ is gitignored for local dev; force-add so the bot can publish it
          git add -f feeds/
          git add README.md
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: update RSS feeds ($(date -u +%Y-%m-%d)) [skip ci]"
            # If the branch moved while this run was executing, replay on top and retry once
            git push || {
              git fetch origin
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
              git push
            }
          fi
